name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static project verification
        shell: powershell
        run: python tools/verify-project.py
      - name: Build MSI and NSIS installer
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lzt-tunnel-windows
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
