[package]
name="lzt-tunnel"
version="1.12.0"
edition="2021"

[build-dependencies]
tauri-build= {version="2",features= [] }

[dependencies]
tauri= {version="2",features= [] }
tauri-plugin-shell="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
serde_yaml="0.9"
reqwest= {version="0.12",default-features=false,features= ["rustls-tls", "json"] }
tokio= {version="1",features= ["rt", "net", "time", "process", "sync"] }
url="2"
base64="0.22"
sha2="0.10"
hex="0.4"
percent-encoding="2"

[target.'cfg(windows)'.dependencies]
windows-sys= {version="0.59",features= ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic="abort"
codegen-units=1
lto=true
opt-level="s"
strip=true
